services:
  - type: web
    name: mtn-rag-whatsapp
    env: python
    plan: free
    region: oregon
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install --index-url https://pypi.org/simple --trusted-host pypi.org --trusted-host files.pythonhosted.org --trusted-host pypi.python.org -r requirements.txt
    startCommand: python -m src.whatsapp_bot
    envVars:
      - key: PORT
        value: 8000
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
